name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Code scanning cannot be enabled for this repository at all: personal-
    # account repos get no Code scanning section in Settings, the Security and
    # quality tab says "Advanced Security is only available for Organizations",
    # and the admin API answers 422/403/404 (KI-048). The analyze step there-
    # fore fails with "Code scanning is not enabled" on every push — a config
    # error, not a finding. The job stays non-blocking until the repo moves to
    # an organization or GitHub opens code scanning to personal accounts.
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended only: the quality suite buried real findings under
          # 100+ lint-grade alerts (unused variables etc.) that ESLint already
          # covers in CI. Security alerts stay; maintainability noise goes.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
