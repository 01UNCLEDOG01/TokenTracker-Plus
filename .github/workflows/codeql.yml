name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Code scanning has never been enabled in the repository settings, so the
    # analyze step fails with "Code scanning is not enabled" on every push
    # (config error, not a finding). The classic token used for automation
    # cannot flip that toggle (the code-scanning admin endpoints 404), so the
    # job stays non-blocking until the owner enables code scanning in
    # Settings → Code security; after that this can go back to blocking.
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended only: the quality suite buried real findings under
          # 100+ lint-grade alerts (unused variables etc.) that ESLint already
          # covers in CI. Security alerts stay; maintainability noise goes.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
