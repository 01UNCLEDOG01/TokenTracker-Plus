name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Code scanning now works here (the first public scan produced 95 alerts,
    # triaged in KI-048): the SARIF upload lands and the alerts UI/API reads
    # them. This job used to carry `continue-on-error: true` while KI-048
    # recorded that personal-account repos could not enable code scanning; that
    # limitation is gone, so an analysis or upload failure now fails the run
    # like any other config error instead of staying invisible.
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended only: the quality suite buried real findings under
          # 100+ lint-grade alerts (unused variables etc.) that ESLint already
          # covers in CI. Security alerts stay; maintainability noise goes.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
